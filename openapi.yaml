openapi: 3.1.0
info:
  title: Менеджер баллов — API мини-приложения MAX
  version: 1.0.0
  description: |-
    Все реализованные эндпоинты бэкенда. Файл сгенерирован springdoc по контроллерам и дополнен описаниями.

    Авторизация: POST /v1/auth/exchange меняет launch params MAX на JWT; остальные запросы — `Authorization: Bearer <JWT>`. sessionId в пути должен совпадать с пользователем из JWT, иначе 404.

    Ошибки: `{code, message}`, message на русском. Коды: validation_failed, bad_request, not_found, invalid_init_data, invalid_jwt, onboarding_required, version_conflict, internal_error.

    Логика расчёта, рекомендаций и плана 5×5 — в SPEC.md.
servers:
- url: https://runiversityadmission.ru/api
  description: Прод (nginx проксирует /api/ на бэкенд)
- url: http://localhost:8080
  description: Локальный запуск
paths:
  /v1/auth/exchange:
    post:
      tags:
      - Авторизация
      summary: Обменять launch params MAX на JWT
      description: Проверяет подпись initData мини-приложения и выдаёт JWT. sessionId = id пользователя в JWT.
      operationId: exchange
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeResponse'
        '401':
          description: 'invalid_init_data: подпись initData не прошла проверку'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'onboarding_required: пользователь ещё не прошёл анкету в боте'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/achievements:
    get:
      tags:
      - Справочники
      summary: Справочник индивидуальных достижений
      description: Достижения с одинаковым exclusiveGroup взаимоисключающие (медаль I или II степени).
      operationId: getAchievements
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AchievementResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет или истёк JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Чужая или несуществующая заявка, неизвестный ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/citizenship-groups:
    get:
      tags:
