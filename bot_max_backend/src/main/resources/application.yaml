spring:
  application:
    name: bot
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mydatabase}
    username: ${POSTGRES_USER:myuser}
    password: ${POSTGRES_PASSWORD:secret}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  web:
    # Сообщения валидации всегда по-русски, независимо от Accept-Language клиента.
    locale: ru
    locale-resolver: fixed
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

max:
  bot:
    token: ${MAX_BOT_TOKEN:}
    webhook-secret: ${MAX_WEBHOOK_SECRET:}
    web-app: ${MAX_WEB_APP:t722_hakaton_max_bot}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-change-me-32chars}
  ttl: ${JWT_TTL:3600}

logging:
  level:
    com.runiversityadmisson.bot: DEBUG
    org.springframework.web: INFO

bot:
  session-ttl: PT1H
  onboarding:
    # true — бот спрашивает язык и гражданство; false — сразу к ЕГЭ, язык ru, гражданство RU
    ask-language-and-citizenship: ${BOT_ASK_LANGUAGE_AND_CITIZENSHIP:false}
